name: Generated cloud client tests

on:
  push:
    branches: [main]
    paths:
      - "src/_celesto_cloud_api/**"
      - "tests/test_generated_cloud_client.py"
      - ".github/workflows/generated-cloud-client.yml"
  pull_request:
    paths:
      - "src/_celesto_cloud_api/**"
      - "tests/test_generated_cloud_client.py"
      - ".github/workflows/generated-cloud-client.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install generated client test dependencies
        run: uv sync --extra dev --no-install-workspace --python 3.13

      - name: Run generated client tests
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_generated_cloud_client.py
