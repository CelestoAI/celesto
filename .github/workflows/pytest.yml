name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14"]
        # One macOS leg rather than the full cross-product: macOS runners are
        # slower to schedule, and a single job is enough to catch an assertion
        # that only holds on Linux. macOS is the first OS in the package
        # classifiers and CONTRIBUTING.md documents it as a dev platform, but
        # the suite had never run on it.
        include:
          # `label` is undefined on the ubuntu legs, so it renders empty and their
          # existing check names are untouched -- required status checks and the
          # merge queue gate on those names.
          - os: macos-latest
            python-version: "3.14"
            label: ", macOS"

    name: pytest (Python ${{ matrix.python-version }}${{ matrix.label }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The cache key includes the Python version: celesto-core is a pyo3
      # extension module linked against a specific interpreter, so build
      # artifacts are not shareable across matrix entries.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'celesto-core/Cargo.toml', 'guest-agent/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      # uv workspace resolves celesto-core from local celesto-core/ directory
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # Netlink is a Linux interface, so HAS_NETLINK is False on macOS by
      # design. Assert the strong property where it applies; macOS asserts the
      # portable one below.
      - name: Assert native extension available
        if: runner.os == 'Linux'
        run: |
          uv run python -c "
          from celesto.host._accel import HAS_NETLINK
          assert HAS_NETLINK, 'celesto-core not loaded'
          from celesto_core import network
          assert network.available(), 'Native extension reports native networking unavailable on Linux'
          print('celesto-core: OK')
          "

      - name: Assert native extension available (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run python -c "
          from celesto_core import disk
          assert disk.available(), 'Native extension reports native disk I/O unavailable'
          print('celesto-core: OK')
          "

      - name: Run pytest
        # Generated-client-only contracts have their own path-filtered workflow.
        run: uv run pytest --ignore=tests/test_generated_cloud_client.py

      # The guest agent is pure Rust and does not link against Python, so
      # running it once is enough to cover the whole matrix.
      - name: Run Rust guest-agent tests
        if: matrix.python-version == '3.13'
        run: cargo test -p celesto-guest-agent

  package-smoke:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'celesto-core/Cargo.toml', 'guest-agent/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Build release artifacts
        run: |
          uv build --package celesto-core --wheel --out-dir celesto-core/dist
          uv build --package celesto --wheel --out-dir dist

      - name: Smoke test built wheels
        run: |
          # Read celesto version and the celesto-core version it depends on.
          # celesto and celesto-core are released independently, so we pull the
          # expected core version from the
          # pyproject dependency string rather than assuming lockstep.
          eval "$(python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]

          core_dep = next(
              (
                  d
                  for d in data["project"]["dependencies"]
                  if re.match(r"^celesto-core(\s|[<>=!~]|$)", d)
              ),
              None,
          )
          assert core_dep is not None, "pyproject must declare a celesto-core dependency"
          m = re.search(r"(\d+\.\d+\.\d+(?:[a-zA-Z0-9.\-]*)?)", core_dep)
          assert m is not None, f"could not parse version from {core_dep!r}"
          print(f"VERSION={version}")
          print(f"CORE_VERSION={m.group(1)}")
          PY
          )"

          uv venv .smoke-venv --python 3.13
          uv pip install \
            --python .smoke-venv/bin/python3 \
            --find-links celesto-core/dist \
            --find-links dist \
            "celesto==${VERSION}"

          .smoke-venv/bin/python3 - <<PY
          import os
          import platform
          import subprocess
          from pathlib import Path
          from importlib.metadata import version as pkg_version

          import _celesto_cloud_api
          from celesto.host._accel import HAS_NETLINK
          from celesto.host.setup import detect_setup_platform, resolve_setup_script
          from celesto.images import builder as image_builder

          assert pkg_version("celesto") == "${VERSION}"
          assert pkg_version("celesto-core") == "${CORE_VERSION}"
          assert Path(_celesto_cloud_api.__file__).is_file(), (
              "generated cloud API package missing from wheel"
          )
          if platform.system() == "Linux":
              assert HAS_NETLINK, "celesto-core native extension did not load from built wheel"
          setup_script = resolve_setup_script(detect_setup_platform())
          assert setup_script.is_file(), f"setup script missing from wheel: {setup_script}"

          assets_dir = Path(
              subprocess.check_output(
                  [".smoke-venv/bin/celesto", "setup", "--assets-dir"],
                  text=True,
              ).strip()
          )
          assert assets_dir.resolve() == setup_script.parent.resolve()
          for helper in (
              "configure-runtime-sudoers.sh",
              "image-build-loopfs.sh",
              "install-firecracker.sh",
          ):
              helper_path = assets_dir / "internal" / helper
              assert helper_path.is_file(), f"missing packaged helper: {helper_path}"

          os.environ.pop("CELESTO_GUEST_AGENT_BINARY", None)
          assert not image_builder._has_guest_agent_source_checkout()
          image_cache = Path(os.environ["RUNNER_TEMP"]) / "celesto-wheel-smoke-images"
          agent = image_builder._guest_agent_binary(image_cache)
          assert agent.is_file(), f"published guest agent missing: {agent}"
          assert agent.read_bytes().startswith(b"\x7fELF"), f"invalid guest agent binary: {agent}"
          assert os.access(agent, os.X_OK), f"guest agent is not executable: {agent}"
          assert image_builder._guest_agent_binary(image_cache) == agent
          print("artifact install: OK")
          PY
