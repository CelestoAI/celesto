name: E2E backend

on:
  workflow_call:
    inputs:
      backend:
        type: string
        required: true
      policy_release_validation:
        type: boolean
        default: false
      policy_samples:
        type: number
        default: 100

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shard == 'release' && 'Release validation' || format('Shard {0}', matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.policy_release_validation && 150 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.policy_release_validation && '["release"]' || '["1","2"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image release fallback
        id: image_release_fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_tag=$(awk -F'"' '/^IMAGES_RELEASE_TAG[[:space:]]*=/{print $2; exit}' src/celesto/images/published.py)
          if [ -z "$source_tag" ]; then
            echo "ERROR: IMAGES_RELEASE_TAG could not be parsed from src/celesto/images/published.py" >&2
            exit 1
          fi

          published_tag=$(
            gh api "/repos/${{ github.repository }}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$source_tag\" and .draft == false and .prerelease == false) | .tag_name" \
              | head -n1
          )
          if [ "$published_tag" = "$source_tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Using pinned published image release: $source_tag"
            exit 0
          fi

          fallback=$(
            gh api "/repos/${{ github.repository }}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(startswith("images-"))][0]'
          )
          if [[ -z "$fallback" || "$fallback" == "null" ]]; then
            echo "No published images-* GitHub Release was found for E2E fallback." >&2
            exit 1
          fi
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${{ github.repository }}/contents/src/celesto/images/published.py?ref=$fallback" \
            > "$RUNNER_TEMP/rootfs-fallback.py" || gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${{ github.repository }}/contents/src/celesto/images/published.py?ref=$fallback" \
            > "$RUNNER_TEMP/rootfs-fallback.py"
          python3 - "$RUNNER_TEMP/rootfs-fallback.py" "$fallback" <<'PYTHON'
          import ast
          import re
          import sys
          from pathlib import Path

          fallback_path, fallback_tag = sys.argv[1:]
          target = Path("src/celesto/images/published.py")
          source = target.read_text()

          def assignments(text):
              return {node.targets[0].id: node for node in ast.parse(text).body
                      if isinstance(node, ast.Assign) and len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Name)}

          current = assignments(source)
          fallback = assignments(Path(fallback_path).read_text())
          # Preserve all current kernel pins and APIs: only rootfs release data moves.
          updates = {"IMAGES_RELEASE_TAG": fallback_tag}
          for name in current:
              if name.endswith("_ROOTFS_SHA"):
                  if name not in fallback:
                      raise SystemExit(f"Published fallback lacks rootfs pin {name}")
                  digest = ast.literal_eval(fallback[name].value)
                  if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                      raise SystemExit(f"Invalid published rootfs pin {name}")
                  updates[name] = digest
          lines = source.splitlines(keepends=True)
          for name in sorted(updates, key=lambda item: current[item].lineno, reverse=True):
              node = current[name]
              lines[node.lineno - 1:node.end_lineno] = [f"{name} = {updates[name]!r}\n"]
          target.write_text("".join(lines))
          PYTHON
          echo "tag=" >> "$GITHUB_OUTPUT"
          echo "Pinned image release $source_tag is not public yet; using published-image catalog from $fallback (rootfs pins only; current kernels preserved)"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'celesto-core/Cargo.toml', 'guest-agent/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install QEMU + tooling
        if: inputs.backend == 'qemu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 qemu-utils openssh-client

      - name: Install Firecracker + tooling
        if: inputs.backend == 'firecracker'
        run: |
          sudo bash scripts/system-setup.sh \
            --configure-runtime \
            --runtime-user "$USER"

      - name: Install network test tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping nftables iptables

      - name: Forward DNS for Firecracker guests
        if: inputs.backend == 'firecracker'
        run: |
          # The guest uses its TAP gateway for DNS. GitHub runners block
          # direct guest queries to public and Azure DNS servers, so forward
          # through the runner's own resolver during package-install tests.
          sudo apt-get install -y --no-install-recommends dnsmasq-base
          sudo dnsmasq \
            --conf-file=/dev/null \
            --bind-dynamic \
            --listen-address=172.16.0.1 \
            --except-interface=lo \
            --pid-file=/run/celesto-e2e-dnsmasq.pid
          sudo test -s /run/celesto-e2e-dnsmasq.pid
          # Docker on the hosted runner sets FORWARD to DROP. Its chain can
          # override the separate nftables accept rule Celesto adds for TAPs.
          # Admit only TAP traffic toward the runner's default interface and
          # established replies, before Docker's FORWARD policy is evaluated.
          sudo iptables -S FORWARD
          outbound=$(ip -4 route show default | awk '{print $5; exit}')
          test -n "$outbound"
          sudo iptables -I FORWARD 1 -i tap+ -o "$outbound" -j ACCEPT
          sudo iptables -I FORWARD 1 -i "$outbound" -o tap+ \
            -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      - name: Enable KVM and optional vsock
        run: |
          # The runner user isn't in the active kvm group for this already-
          # running job. Add it to /etc/group, set the devices to the same
          # root:kvm mode used by system setup, then run KVM commands below via
          # `sudo -u "$USER" -g kvm` so the group is active for each command.
          sudo groupadd -f kvm
          sudo usermod -a -G kvm "$USER" || true
          sudo chgrp kvm /dev/kvm || true
          sudo chmod 660 /dev/kvm || true
          if [[ "${{ inputs.backend }}" == "qemu" ]]; then
            sudo modprobe vhost_vsock || echo "vhost_vsock unavailable; vsock tests will skip"
            # /dev/vhost-vsock ships as root:kvm mode 660; the `usermod` above
            # doesn't apply to this already-running job, so normalize the
            # device and run pytest with the kvm group active below.
            sudo chgrp kvm /dev/vhost-vsock || true
            sudo chmod 660 /dev/vhost-vsock || true
          fi
          ls -l /dev/kvm /dev/vhost-vsock || true

      # uv workspace builds celesto-core from the local celesto-core/ directory.
      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Build current-source Ubuntu candidate
        if: ${{ !inputs.policy_release_validation }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools zstd e2fsprogs
          .venv/bin/python scripts/ci/prepare-e2e-ubuntu.py prepare \
            "${{ inputs.backend }}" "$RUNNER_TEMP/ubuntu-candidate"

      - name: Serve current-source Ubuntu candidate
        if: ${{ !inputs.policy_release_validation }}
        run: |
          .venv/bin/python scripts/ci/prepare-e2e-ubuntu.py serve \
            "${{ inputs.backend }}" "$RUNNER_TEMP/ubuntu-candidate" \
            > "$RUNNER_TEMP/ubuntu-candidate/server.log" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$RUNNER_TEMP/ubuntu-candidate/server.pid"
          for attempt in {1..100}; do
            if test -s "$RUNNER_TEMP/ubuntu-candidate/ready"; then
              cat "$RUNNER_TEMP/ubuntu-candidate/ready"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ubuntu-candidate/server.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/ubuntu-candidate/server.log"
          echo "Current-source Ubuntu candidate server did not become ready" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build dashboard UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

      - name: Select preinstalled Chromium
        if: matrix.shard == '2'
        run: |
          chromium=$(command -v chromium)
          "$chromium" --version
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chromium" >> "$GITHUB_ENV"

      - name: Assert native extension available
        run: |
          sudo -n -E -u "$USER" -g kvm -- env "PATH=$PATH" "$(command -v uv)" run python -c "from celesto_core import network; assert network.available(), 'Native extension reports native networking unavailable on Linux'; print('celesto-core: OK')"

      - name: Diagnostics (celesto doctor)
        run: sudo -n -E -u "$USER" -g kvm -- env "PATH=$PATH" "$(command -v uv)" run celesto doctor --backend "${{ inputs.backend }}" || true

      - name: Run e2e suite
        env:
          CELESTO_IMAGES_RELEASE_TAG: ${{ steps.image_release_fallback.outputs.tag }}
          E2E_BACKEND: ${{ inputs.backend }}
          E2E_SHARD: ${{ matrix.shard }}
        run: |
          test_paths=(tests/e2e)
          pytest_args=()
          if [[ "$E2E_SHARD" == "release" ]]; then
            test_paths=(tests/e2e/test_network_policy.py)
          else
            # Keep modules whole for shared VM fixtures. The second shard picks
            # up every other file, including newly added tests.
            if [[ "$E2E_BACKEND" == "qemu" ]]; then
              first_shard=(tests/e2e/test_browser.py tests/e2e/test_guest_docker.py)
            else
              first_shard=(tests/e2e/test_network_policy.py tests/e2e/test_ssh_paste.py)
            fi
            if [[ "$E2E_SHARD" == "1" ]]; then
              test_paths=("${first_shard[@]}")
            else
              for path in "${first_shard[@]}"; do
                pytest_args+=(--ignore="$path")
              done
            fi
          fi
          sudo -n -E -u "$USER" -g kvm -- env "PATH=$PATH" "CELESTO_IMAGES_RELEASE_TAG=${CELESTO_IMAGES_RELEASE_TAG:-}" "$(command -v uv)" run \
            --with playwright --with websockets --with 'pydantic-ai-slim[openai]' \
            pytest -m e2e "${test_paths[@]}" -v --e2e-backend "$E2E_BACKEND" "${pytest_args[@]}"

      - name: Build baseline and candidate wheels
        if: inputs.policy_release_validation && inputs.backend == 'firecracker'
        run: |
          # Parent of the network-policy merge: identical benchmark and image
          # catalog are used on both versions on this same disposable runner.
          git fetch origin 685b7bd52d0de8efb1c88fe8cf053d0d3b64d171
          git worktree add --detach "$RUNNER_TEMP/policy-baseline" FETCH_HEAD
          cp src/celesto/images/published.py "$RUNNER_TEMP/policy-baseline/src/celesto/images/published.py"
          uv build --wheel --out-dir "$RUNNER_TEMP/policy-wheels/baseline" "$RUNNER_TEMP/policy-baseline"
          uv build --wheel --out-dir "$RUNNER_TEMP/policy-wheels/candidate"
          for version in baseline candidate; do
            uv venv "$RUNNER_TEMP/policy-$version-venv"
            uv pip install --python "$RUNNER_TEMP/policy-$version-venv/bin/python" \
              "$RUNNER_TEMP/policy-wheels/$version/"*.whl
          done

      - name: Validate installed examples and measure network policy
        if: inputs.policy_release_validation && inputs.backend == 'firecracker'
        env:
          CELESTO_POLICY_BASELINE_PYTHON: ${{ runner.temp }}/policy-baseline-venv/bin/python
          CELESTO_POLICY_CANDIDATE_PYTHON: ${{ runner.temp }}/policy-candidate-venv/bin/python
          CELESTO_POLICY_RESULTS: ${{ runner.temp }}/policy-results
          CELESTO_POLICY_SAMPLES: ${{ inputs.policy_samples }}
        run: |
          mkdir -p "$CELESTO_POLICY_RESULTS"
          git rev-parse HEAD > "$CELESTO_POLICY_RESULTS/candidate-sha.txt"
          git -C "$RUNNER_TEMP/policy-baseline" rev-parse HEAD > "$CELESTO_POLICY_RESULTS/baseline-sha.txt"
          lscpu > "$CELESTO_POLICY_RESULTS/runner.txt"
          cp src/celesto/images/published.py "$CELESTO_POLICY_RESULTS/image-catalog.py"
          uv pip freeze --python "$CELESTO_POLICY_CANDIDATE_PYTHON" > "$CELESTO_POLICY_RESULTS/candidate-packages.txt"
          uv pip freeze --python "$CELESTO_POLICY_BASELINE_PYTHON" > "$CELESTO_POLICY_RESULTS/baseline-packages.txt"
          sudo -n -E -u "$USER" -g kvm -- env "PATH=$PATH" "$(command -v uv)" run \
            pytest -m e2e tests/e2e/test_network_policy_release.py -v -s --e2e-backend firecracker

      - name: Upload network-policy release evidence
        if: always() && inputs.policy_release_validation && inputs.backend == 'firecracker'
        uses: actions/upload-artifact@v4
        with:
          name: network-policy-release-evidence
          path: ${{ runner.temp }}/policy-results

      - name: Stop current-source Ubuntu candidate server
        if: ${{ always() && !inputs.policy_release_validation }}
        run: |
          if test -s "$RUNNER_TEMP/ubuntu-candidate/server.pid"; then
            kill "$(cat "$RUNNER_TEMP/ubuntu-candidate/server.pid")" 2>/dev/null || true
          fi

      - name: Upload current-source Ubuntu candidate
        if: ${{ always() && !inputs.policy_release_validation }}
        uses: actions/upload-artifact@v4
        with:
          name: unreleased-ubuntu-candidate-${{ inputs.backend }}${{ matrix.shard == '2' && '-shard-2' || '' }}
          path: ${{ runner.temp }}/ubuntu-candidate/artifacts
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore

      - name: Dump VM logs on failure
        if: failure()
        run: |
          echo "## e2e failed — recent VM/runtime logs" >> "$GITHUB_STEP_SUMMARY"
          # Celesto writes per-VM logs to <data_dir>/<vm_id>.log. data_dir resolves
          # (see resolve_data_dir / _candidate_data_dirs in celesto/vm.py) to
          # $CELESTO_DATA_DIR, else ${XDG_STATE_HOME:-$HOME/.local/state}/celesto,
          # else /var/lib/celesto. (~/.celesto holds image/key logs — kept too.)
          for d in \
              "$CELESTO_DATA_DIR" \
              "${XDG_STATE_HOME:-$HOME/.local/state}/celesto" \
              "/var/lib/celesto" \
              "$HOME/.celesto"; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            echo "### $d" >> "$GITHUB_STEP_SUMMARY"
            find "$d" -name "*.log" -type f 2>/dev/null | while read -r f; do
              echo "<details><summary>$f</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -100 "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            done
          done
