# Real-KVM end-to-end smoke of the public Celesto API.
#
# Unlike the unit suite (which mocks the hypervisor) and smoke-published-images
# (which shells out to raw qemu), this boots actual micro-VMs *through the
# Celesto Python API* and walks their lifecycle — start, exec, file
# upload/download, pause/resume, snapshot/restore, stop/cleanup, and direct
# bridge connectivity. QEMU and Firecracker are both exercised over SSH and vsock.
#
# GH-hosted ubuntu-latest (x86) exposes /dev/kvm, so this runs with hardware
# acceleration. The suite gates review-ready PRs and pushes to main; the
# nightly cron still runs to catch runner/environment drift on days with no PRs,
# and it can be launched manually.

name: E2E (real KVM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    # 03:17 UTC nightly (off the top of the hour to dodge cron congestion).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      policy_release_validation:
        description: Run installed-wheel smoke and the network-policy performance matrix
        type: boolean
        default: false
      policy_samples:
        description: Samples per case (100 for release evidence; smaller for a smoke run)
        type: number
        default: 100

# Cancel in-flight runs on the same ref so only the newest commit is verified.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemu-e2e:
    name: QEMU E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/e2e-backend.yml
    with:
      backend: qemu
      policy_release_validation: ${{ inputs.policy_release_validation == true }}
      policy_samples: ${{ github.event_name != 'workflow_dispatch' && 100 || inputs.policy_samples }}

  firecracker-e2e:
    name: Firecracker E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/e2e-backend.yml
    with:
      backend: firecracker
      policy_release_validation: ${{ inputs.policy_release_validation == true }}
      policy_samples: ${{ github.event_name != 'workflow_dispatch' && 100 || inputs.policy_samples }}

  # These names are required status checks on main. Each reports its backend's shards.
  qemu:
    name: qemu
    needs: qemu-e2e
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check QEMU results
        env:
          RESULT: ${{ needs.qemu-e2e.result }}
        run: |
          echo "QEMU E2E result: $RESULT"
          test "$RESULT" = success

  firecracker:
    name: firecracker
    needs: firecracker-e2e
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check Firecracker results
        env:
          RESULT: ${{ needs.firecracker-e2e.result }}
        run: |
          echo "Firecracker E2E result: $RESULT"
          test "$RESULT" = success
