repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Match the installed ruff version (0.15.1)
    rev: v0.15.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        # TypeDoc owns these bytes; CI verifies them by regenerating the reference.
        exclude: ^((README|AGENTS|GEMINI|SECURITY)\.md$|docs/typescript/api/)
        additional_dependencies:
          - mdformat-ruff
          - mdformat-frontmatter==2.1.2

  - repo: https://github.com/srstevenson/nb-clean
    rev: 3.2.0
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-outputs
          - --preserve-cell-metadata
          - tags
          - slideshow

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Use the project libraries so attrs/Pydantic models are typed
        # exactly as they are at runtime, rather than as missing imports.
        entry: uv run --extra dev --extra dashboard --extra server mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: [--ignore-missing-imports, --scripts-are-modules, --explicit-package-bases]
